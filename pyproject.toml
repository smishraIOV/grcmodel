[project]
name = "GRCmodel"
version = "0.1.0"
description = "GRC framework and quantitative model"
readme = "readme.md"
authors = [
    { name = "smishraiov", email = "shreemoy@rootstocklabs.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "torch>=2.14.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: solves a model on a grid; minutes, not seconds"]
# The default run is the accounting core and the quick research checks.
# `uv run pytest -m slow` runs the solver tests; `-m "slow or not slow"` runs everything.
addopts = "-m 'not slow'"
